name: Container build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - Cargo.toml
      - Cargo.lock
      - 'apps/server/**'
      - 'crates/protocol/**'
      - 'crates/transfer/**'
      - apps/desktop/Cargo.toml
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose --file compose.yaml config --quiet
      - name: Build server image
        run: docker build --file Dockerfile --tag cyclar/server:local .
      - name: Check volume permissions as runtime user
        run: docker compose --file compose.yaml run --rm --no-deps -T --entrypoint sh server -c 'test "$(id -u)" -eq 1000 && test -w /var/lib/cyclar'
      - name: Initialize and check container health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose --file compose.yaml down --volumes --remove-orphans' EXIT
          secret="$(openssl rand -hex 24)"
          printf '%s\n' "$secret" | docker compose --file compose.yaml run --rm --no-deps -T server init --data-dir /var/lib/cyclar --admin-user smoke
          unset secret
          docker compose --file compose.yaml up --detach server
          container="$(docker compose --file compose.yaml ps --quiet server)"
          for attempt in $(seq 1 75); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$status" = healthy ]; then
              docker compose --file compose.yaml exec -T server wget -q -O /dev/null http://127.0.0.1:8080/healthz
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1
