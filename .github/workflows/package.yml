name: Package binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-package-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-package-${{ runner.os }}-
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build server
        run: cargo build -p cyclar-server --release --locked
      - name: Build Linux/X11 applications
        if: runner.os == 'Linux'
        run: cargo build -p cyclar-desktop --bins --release --locked
      - name: Archive server (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="cyclar-server-${{ runner.os }}-${{ runner.arch }}.tar.gz"
          mkdir -p package/server
          cp target/release/cyclar-server LICENSE package/server/
          tar -czf "$archive" -C package/server .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Archive Linux/X11 applications
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="cyclar-linux-x11-${{ runner.arch }}.tar.gz"
          mkdir -p package/desktop
          cp target/release/cyclar-host target/release/cyclar-desktop LICENSE package/desktop/
          tar -czf "$archive" -C package/desktop .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Archive server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "cyclar-server-${{ runner.os }}-${{ runner.arch }}.zip"
          New-Item -ItemType Directory -Path 'package/server' -Force | Out-Null
          Copy-Item 'target/release/cyclar-server.exe','LICENSE' -Destination 'package/server'
          Compress-Archive -Path 'package/server/*' -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content -Path "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclar-${{ runner.os }}-${{ runner.arch }}
          path: |
            cyclar-*.tar.gz
            cyclar-*.zip
            cyclar-*.sha256
          if-no-files-found: error
          retention-days: 14
