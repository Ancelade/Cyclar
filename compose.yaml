services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyclar/server:local
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    volumes:
      - cyclar-data:/var/lib/cyclar
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  cyclar-data:
