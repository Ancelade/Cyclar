[package]
name = "cyclar-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["form", "json", "macros", "ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cyclar-protocol = { path = "../../crates/protocol" }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
maud = { version = "0.26", features = ["axum"] }
rand = "0.8"
redb = "2.6"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "limit", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
cyclar-desktop = { path = "../desktop" }
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.28", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
