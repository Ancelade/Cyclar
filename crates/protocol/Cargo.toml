[package]
name = "cyclar-protocol"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Internal-Use-1.0.0"
description = "Shared wire types and signed session grants for Cyclar"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0"
